  <rect x="8" y="8" width="1164" height="594" rx="24" fill="url(#grid)" opacity=".35"/>
  <rect x="8.5" y="8.5" width="1163" height="593" rx="23.5" fill="none" stroke="url(#frame)" stroke-opacity=".8"/>

