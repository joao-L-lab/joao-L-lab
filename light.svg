<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Perfil profissional de João Lucas, estudante de Engenharia de Software de Goiás, Brasil, com foco em Backend, Arquitetura de Sistemas e Bancos de Dados.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".1" cy=".06" r=".42">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".1"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".92" cy=".96" r=".45">
